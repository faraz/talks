<!doctype html>
<html lang="en">
  <head>
    <script>
(function () {
  var base = "/talks/";
  var path = location.pathname;
  var query = new URLSearchParams(location.search);
  var old = base + 'inference-stack';
  if (path === old || path.indexOf(old + '/') === 0) path = base + 's/inference-stack';
  if (path.indexOf(base + 'play/') === 0) {
    path = base + 's/' + path.slice((base + 'play/').length).replace(/\/+$/, '');
    query.set('play', '1');
  }
  var search = query.toString();
  if (path !== location.pathname || search !== location.search.slice(1)) history.replaceState(null, '', path + (search ? '?' + search : '') + location.hash);
  if (!query.has('play')) return;
  var seen = false;
  var tries = 0;
  var timer = setInterval(function () {
    var viewer = document.querySelector('main[data-slide-id]');
    if (viewer) {
      seen = true;
      document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    } else if (seen || ++tries > 300) {
      clearInterval(timer);
    }
  }, 100);
})();
</script>

    <script>
      // Apply the stored theme before first paint; next-themes only runs
      // after the bundle loads, which flashes white for dark-mode users.
      let stored = null;
      try {
        stored = localStorage.getItem('theme');
      } catch (_) {}
      const dark =
        stored === 'dark' ||
        (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    </script>
